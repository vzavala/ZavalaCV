# Jupyter Book configuration: https://jupyterbook.org/en/stable/customize/config.html
title: Curriculum Vitae
author: Victor M. Zavala
copyright: "2026"
only_build_toc_files: true
exclude_patterns: [.venv, _build, tools, .github, README.md, "**/.ipynb_checkpoints"]

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - colon_fence
    - linkify

repository:
  url: https://github.com/vzavala/ZavalaCV
  branch: main

html:
  use_repository_button: false
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true

sphinx:
  config:
    html_show_sourcelink: false
    html_theme_options:
      show_toc_level: 2
